name: 🚀 CI - WaveSurf

on:
  push:
    branches: [ develop ]

env:
  NODE_VERSION: '18'

jobs:
  # ===============================================
  # 🔍 QUALIDADE DE CÓDIGO
  # ===============================================
  
  code-quality:
    name: 🔍 Qualidade de Código
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 📚 Install Dependencies
        run: npm ci
      
      - name: 🔍 ESLint
        run: npm run lint
      
      - name: 📊 TypeScript Check
        run: npx tsc --noEmit

  # ===============================================
  # 🛡️ SEGURANÇA
  # ===============================================
  
  security:
    name: 🛡️ Testes de Segurança
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [code-quality]
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 📚 Install Dependencies
        run: npm ci
      
      - name: 🔒 Audit Dependencies
        run: npm audit --audit-level high
      
      - name: 🔍 Security Scan (Semgrep)
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/owasp-top-ten

  # ===============================================
  # ♿ ACESSIBILIDADE
  # ===============================================
  
  accessibility:
    name: ♿ Testes de Acessibilidade
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [code-quality]
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 📚 Install Dependencies
        run: npm ci
      
      - name: 🏗️ Build
        run: npm run build
      
      - name: 🌐 Start Server
        run: |
          npm run preview &
          sleep 10
          curl -f http://localhost:4173 || exit 1
      
      - name: ♿ Install axe-core CLI
        run: npm install -g @axe-core/cli
      
      - name: ♿ Accessibility Tests
        run: |
          axe http://localhost:4173 --tags wcag2a,wcag2aa,wcag21aa --exit || echo "Accessibility issues found"
          axe http://localhost:4173/login --tags wcag2a,wcag2aa,wcag21aa --exit || echo "Login page accessibility issues found"

  # ===============================================
  # 🏗️ BUILD
  # ===============================================
  
  build:
    name: 🏗️ Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [security, accessibility]
    
    strategy:
      matrix:
        node-version: [18, 20]
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 📦 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: 📚 Install Dependencies
        run: npm ci
      
      - name: 🏗️ Build
        run: npm run build
      
      - name: 📏 Check Build Size
        run: |
          echo "Build completed successfully!"
          ls -la dist/
          du -sh dist/
      
      - name: 🌐 Test Preview Server
        run: |
          npm run preview &
          sleep 10
          curl -f http://localhost:4173 || exit 1
          echo "Preview server working!"
      
      - name: 📋 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        if: matrix.node-version == '18'
        with:
          name: build-artifacts
          path: dist/

  # ===============================================
  # ✅ SUMMARY
  # ===============================================
  
  ci-summary:
    name: ✅ CI Summary
    runs-on: ubuntu-latest
    needs: [build]
    if: always()
    
    steps:
      - name: 📊 Pipeline Status
        run: |
          echo "## 🚀 WaveSurf CI Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Test Results:" >> $GITHUB_STEP_SUMMARY
          echo "- 🔍 Code Quality: ${{ needs.code-quality.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- 🛡️ Security: ${{ needs.security.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- ♿ Accessibility: ${{ needs.accessibility.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- 🏗️ Build: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.build.result }}" == "success" ]]; then
            echo "🎉 **All tests passed! Ready for deployment.**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Some tests failed. Please check the logs.**" >> $GITHUB_STEP_SUMMARY
          fi
